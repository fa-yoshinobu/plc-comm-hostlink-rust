name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.85 minimum-version check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install declared minimum Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check all targets and features on the declared minimum
        run: cargo +1.85.0 check --all-targets --all-features

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1

      - name: Check GitHub source archive contents
        shell: pwsh
        run: ./scripts/check_source_archive.ps1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Run clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --no-deps --all-features

      - name: Run tests
        run: cargo +stable test --all-targets --all-features

      - name: Validate generated crate and isolated consumer
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

  windows-contract-smoke:
    name: Windows representative contract smoke
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Check fragmented receive accounting
        run: cargo +stable test --test high_level tcp_traffic_stats_are_independent_of_crlf_segmentation

      - name: Check refused TCP connection classification
        run: cargo +stable test --test high_level refused_tcp_connection_is_transport_failure_and_not_adopted

      - name: Check bounded request timeout
        run: cargo +stable test --test high_level tcp_timeout_is_one_deadline_for_a_trickled_response

      - name: Check close retirement and reconnect
        run: cargo +stable test --test high_level close_rejects_active_and_waiting_generation_then_reopen_accepts_only_new_work

      - name: Check delayed UDP response retirement
        run: cargo +stable test --test high_level udp_timeout_discards_delayed_response_before_next_request
